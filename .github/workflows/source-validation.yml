name: Source-only native qualification
on:
  workflow_dispatch:
    inputs:
      seed_tag:
        description: Published full installer release to reuse
        required: true
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: osx-arm64
            python: bin/python
            installer: '*.sh'
          - os: windows-latest
            platform: win-64
            python: python.exe
            installer: '*.exe'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography==46.0.5 packaging==26.3
      - name: Download and authenticate existing full installer
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_TAG: ${{ inputs.seed_tag }}
          INSTALLER_PATTERN: ${{ matrix.installer }}
        run: |
          gh release download "$SEED_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/source-artifact" --pattern "$INSTALLER_PATTERN" --pattern 'release-manifest.*' --pattern SHA256SUMS
          python scripts/source_release.py verify-seed --artifact "$RUNNER_TEMP/source-artifact" --platform '${{ matrix.platform }}' --tag "$SEED_TAG"
      - name: Install existing runtime offline
        run: |
          installer=$(find "$RUNNER_TEMP/source-artifact" -type f \( -name '*.sh' -o -name '*.exe' \) | head -1)
          python scripts/test_installer.py --installer "$installer" --prefix "$RUNNER_TEMP/LiKeWatchSource" --report "$RUNNER_TEMP/source-artifact/installed-smoke.json"
      - name: Qualify exact source using installed maintenance code
        env:
          SEED_TAG: ${{ inputs.seed_tag }}
        run: '"$RUNNER_TEMP/LiKeWatchSource/${{ matrix.python }}" scripts/source_release.py qualify --root "$RUNNER_TEMP/LiKeWatchSource" --artifact "$RUNNER_TEMP/source-artifact" --platform "${{ matrix.platform }}" --tag "$SEED_TAG"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: managed-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/source-artifact/*smoke.json
            ${{ runner.temp }}/source-artifact/update-qualification.json
            ${{ runner.temp }}/source-artifact/payload-metadata.json
            ${{ runner.temp }}/source-artifact/release-manifest.json
          if-no-files-found: error
