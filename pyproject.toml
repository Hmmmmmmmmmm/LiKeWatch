[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "likewatch"
version = "0.1.0"
description = "Local camera and screen OCR monitoring with reliable rule-based alerts"
requires-python = ">=3.13"
dependencies = [
  "PySide6==6.11.2", "numpy==2.5.3", "opencv-python-headless==5.0.0.93",
  "tesserocr==2.11.0", "Pillow==12.3.0", "mss==10.2.0", "httpx==0.28.1",
  "keyring==25.7.0", "platformdirs==4.11.7"
]
[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyinstaller==6.22.2"]
[project.scripts]
likewatch = "likewatch.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
